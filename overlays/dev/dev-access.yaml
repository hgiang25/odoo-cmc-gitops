apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-dev-access
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 8080;
        client_max_body_size 100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        location = /healthz { return 200 'ok'; }
        location /websocket {
          proxy_pass http://odoo-web-stable:8072;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { proxy_pass http://odoo-web-stable:8069; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-dev-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo-dev-access
  template:
    metadata:
      labels:
        app: odoo-dev-access
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: nginx:1.28.0-alpine
        command:
        - nginx
        args:
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: odoo-dev-access
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-dev-access
spec:
  type: ClusterIP
  selector:
    app: odoo-dev-access
  ports:
  - name: http
    port: 8080
    targetPort: http
