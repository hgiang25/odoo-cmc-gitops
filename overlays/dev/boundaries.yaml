apiVersion: v1
kind: ResourceQuota
metadata:
  name: odoo-budget
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 12Gi
    limits.cpu: '16'
    limits.memory: 24Gi
    pods: '20'
    persistentvolumeclaims: '6'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: odoo-defaults
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odoo-web-from-dev-access
spec:
  podSelector:
    matchLabels:
      app: odoo
      component: web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: odoo-dev-access
    ports:
    - protocol: TCP
      port: 8069
    - protocol: TCP
      port: 8072
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odoo-developer
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/portforward
  verbs:
  - create
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odoo-developer
subjects:
- kind: Group
  name: odoo-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: odoo-developer
  apiGroup: rbac.authorization.k8s.io
