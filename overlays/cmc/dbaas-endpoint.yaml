apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-service-dbaas
  namespace: odoo-system
  labels:
    kubernetes.io/service-name: postgres-service
    endpointslice.kubernetes.io/managed-by: odoo-cmc-gitops
addressType: IPv4
ports:
- name: postgres
  protocol: TCP
  port: 5432
endpoints:
- addresses:
  - REPLACE_CMC_DBAAS_PRIVATE_IP
  conditions:
    ready: true
