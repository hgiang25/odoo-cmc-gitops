apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../infrastructure
- network-policies.yaml
patches:
- target:
    kind: StatefulSet
    name: apisix-etcd
  patch: "- op: add\n  path: /spec/volumeClaimTemplates/0/spec/storageClassName\n\
    \  value: highio"
