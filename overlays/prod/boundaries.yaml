apiVersion: v1
kind: ResourceQuota
metadata:
  name: odoo-budget
spec:
  hard:
    requests.cpu: '24'
    requests.memory: 32Gi
    limits.cpu: '48'
    limits.memory: 64Gi
    pods: '40'
    persistentvolumeclaims: '6'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: odoo-defaults
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 512Mi
