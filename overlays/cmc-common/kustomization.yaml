apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odoo-system
resources:
- ../../base
- cloud-resources.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: cmc-deployment-settings
  namespace: odoo-system
  literals:
  - domain=odoo.internal
- name: odoo-runtime-settings
  namespace: odoo-system
  behavior: merge
  literals:
  - s3_required=false
  - s3_endpoint_url=
  - s3_bucket=
  - s3_prefix=odoo/backups
  - aws_region=us-east-1
patches:
- path: delete-postgres-statefulset.yaml
- path: delete-postgres-pvc.yaml
- path: delete-postgres-service.yaml
- target:
    kind: Namespace
    name: odoo-system
  patch: "- op: replace\n  path: /metadata/labels/environment\n  value: cmc-cloud\n\
    - op: add\n  path: /metadata/annotations\n  value:\n    argocd.argoproj.io/sync-wave:\
    \ \"-30\""
- target:
    kind: PersistentVolumeClaim
    name: odoo-(filestore|backup|restore)-pvc
  patch: "- op: add\n  path: /spec/storageClassName\n  value: nfs-csi"
- target:
    kind: PersistentVolumeClaim
  patch: "- op: add\n  path: /metadata/annotations\n  value:\n    argocd.argoproj.io/sync-wave:\
    \ \"-20\""
- target:
    kind: ConfigMap
    name: odoo-(config|runtime-settings)
  patch: "- op: add\n  path: /metadata/annotations\n  value:\n    argocd.argoproj.io/sync-wave:\
    \ \"-20\""
- target:
    kind: Deployment
  patch: "- op: add\n  path: /spec/template/spec/imagePullSecrets\n  value:\n  - name:\
    \ odoo-registry"
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
  patch: "- op: add\n  path: /spec/template/spec/imagePullSecrets\n  value:\n  - name:\
    \ odoo-registry"
- target:
    kind: Job
  patch: "- op: add\n  path: /spec/template/spec/imagePullSecrets\n  value:\n  - name:\
    \ odoo-registry"
- target:
    kind: CronJob
  patch: "- op: add\n  path: /spec/jobTemplate/spec/template/spec/imagePullSecrets\n\
    \  value:\n  - name: odoo-registry"
- target:
    kind: Job
    name: odoo-init-db
  patch: "- op: add\n  path: /metadata/annotations\n  value:\n    argocd.argoproj.io/hook:\
    \ Sync\n    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded\n\
    \    argocd.argoproj.io/sync-wave: \"-10\""
- target:
    group: apisix.apache.org
    version: v2
    kind: ApisixRoute
    name: odoo-gateway
  patch: "- op: add\n  path: /spec/http/0/plugins/-\n  value:\n    name: proxy-rewrite\n\
    \    enable: true\n    config:\n      headers:\n        set:\n          X-Forwarded-Host:\
    \ odoo.internal\n          X-Forwarded-Proto: https\n- op: add\n  path: /spec/http/1/plugins/-\n\
    \  value:\n    name: proxy-rewrite\n    enable: true\n    config:\n      headers:\n\
    \        set:\n          X-Forwarded-Host: odoo.internal\n          X-Forwarded-Proto:\
    \ https\n- op: add\n  path: /spec/http/2/plugins/-\n  value:\n    name: proxy-rewrite\n\
    \    enable: true\n    config:\n      headers:\n        set:\n          X-Forwarded-Host:\
    \ odoo.internal\n          X-Forwarded-Proto: https"
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: odoo-web-rollout
  patch: "- op: add\n  path: /spec/template/spec/topologySpreadConstraints\n  value:\n\
    \  - maxSkew: 1\n    topologyKey: kubernetes.io/hostname\n    whenUnsatisfiable:\
    \ ScheduleAnyway\n    labelSelector:\n      matchLabels:\n        app: odoo\n\
    \        component: web"
- target:
    kind: CronJob
    name: odoo-disaster-recovery-backup
  patch: "- op: add\n  path: /spec/suspend\n  value: true"
replacements:
- source:
    kind: ConfigMap
    name: cmc-deployment-settings
    fieldPath: data.domain
  targets:
  - select:
      group: apisix.apache.org
      version: v2
      kind: ApisixRoute
      name: odoo-gateway
    fieldPaths:
    - spec.http.0.match.hosts.0
    - spec.http.0.plugins.1.config.headers.set.X-Forwarded-Host
    - spec.http.1.match.hosts.0
    - spec.http.1.plugins.1.config.headers.set.X-Forwarded-Host
    - spec.http.2.match.hosts.0
    - spec.http.2.plugins.1.config.headers.set.X-Forwarded-Host
  - select:
      group: apisix.apache.org
      version: v2
      kind: ApisixTls
      name: odoo-tls
    fieldPaths:
    - spec.hosts.0
