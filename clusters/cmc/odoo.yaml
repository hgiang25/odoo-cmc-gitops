apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-cmc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: odoo-cmc
  source:
    repoURL: https://github.com/hgiang25/odoo-cmc-gitops.git
    targetRevision: main
    path: overlays/cmc
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo-system
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/restartAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
