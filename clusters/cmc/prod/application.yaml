apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-prod
  namespace: argocd
  labels:
    odoo.cmc/environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  info:
  - name: Environment
    value: 'PROD | controlled sync | isolated database and nodes'
  - name: Access
    value: 'HA firewall -> private ELB -> APISIX TLS -> stable/canary'
  - name: Release policy
    value: 'Promote tested Dev images without rebuilding; approve odoo-prod deployment in GitHub.'
  project: odoo-prod
  source:
    repoURL: https://github.com/hgiang25/odoo-cmc-gitops.git
    targetRevision: prod
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo-prod
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/restartAt
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: odoo-worker
    jsonPointers:
    - /spec/replicas
  - group: apisix.apache.org
    kind: ApisixRoute
    jqPathExpressions:
    - .spec.http[]?.backends[]?.weight
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
