apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-environments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: odoo-cmc
  source:
    repoURL: https://github.com/hgiang25/odoo-cmc-gitops.git
    targetRevision: main
    path: overlays/environments
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
