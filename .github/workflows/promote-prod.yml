name: Promote latest Dev images to prod
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odoo-cmc-promotion
  cancel-in-progress: false
jobs:
  resolve-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        path: tools
    - uses: actions/checkout@v4
      with:
        ref: dev
        path: accepted-dev
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Resolve latest Dev image pair
      id: resolve
      run: |
        set -euo pipefail
        python -m pip install -r tools/requirements-tools.txt
        echo "revision=$(git -C accepted-dev rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "tag=$(python tools/scripts/promote_environment.py --resolve-dev --source-root accepted-dev)" >> "$GITHUB_OUTPUT"
  verify-dev:
    needs: resolve-dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      revision: ${{ needs.resolve-dev.outputs.revision }}
      expected_tag: ${{ needs.resolve-dev.outputs.tag }}
      verify_only: true
    secrets: inherit
  promote:
    needs: [resolve-dev, verify-dev]
    runs-on: ubuntu-latest
    environment: odoo-prod
    concurrency:
      group: odoo-cmc-git-write-prod
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      tag: ${{ steps.release.outputs.release_tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        path: tools
    - uses: actions/checkout@v4
      with:
        ref: prod
        path: target
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve-dev.outputs.revision }}
        path: accepted-dev
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.32.7
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Publish release tags and update Prod image pair
      id: release
      env:
        EXPECTED_TAG: ${{ needs.resolve-dev.outputs.tag }}
        DEV_REVISION: ${{ needs.resolve-dev.outputs.revision }}
      run: |
        set -euo pipefail
        test "$(git -C accepted-dev rev-parse HEAD)" = "$DEV_REVISION"
        python -m pip install -r tools/requirements-tools.txt
        python tools/validate.py --root target
        python tools/scripts/validate_branch_pair.py --dev-root accepted-dev --prod-root target
        python tools/scripts/promote_environment.py --expected-tag "$EXPECTED_TAG" --source-root accepted-dev --target-root target --release --output "$GITHUB_OUTPUT"
        python tools/validate.py --root target
        python tools/scripts/validate_branch_pair.py --dev-root accepted-dev --prod-root target
    - name: Commit production desired state
      id: commit
      working-directory: target
      env:
        DEV_REVISION: ${{ needs.resolve-dev.outputs.revision }}
        SOURCE_TAG: ${{ needs.resolve-dev.outputs.tag }}
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add overlays/prod/kustomization.yaml
        if ! git diff --cached --quiet; then
          git commit -m "chore(prod): release $RELEASE_TAG from $SOURCE_TAG at dev@$DEV_REVISION"
          # Fail on concurrent branch changes; never rebase an allocated release version.
          git push origin HEAD:prod
        fi
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        printf 'Prod release: %s; source image: %s; Dev revision: %s\n' "$RELEASE_TAG" "$SOURCE_TAG" "$DEV_REVISION" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: promote
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      revision: ${{ needs.promote.outputs.revision }}
      expected_tag: ${{ needs.promote.outputs.tag }}
    secrets: inherit
