name: Verify CMC reconciliation
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Verify the selected environment branch, without deploying
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      image_tag:
        description: Expected immutable image tag (optional)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      expected_tag: ${{ inputs.image_tag }}
      verify_only: true
    secrets: inherit
