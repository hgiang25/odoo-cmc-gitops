name: Bootstrap CMC environment (first install or secret rotation)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bootstrap one environment; daily releases use Deploy Dev/Prod
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/bootstrap-argocd.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
