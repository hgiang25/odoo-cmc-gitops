name: Deploy Dev (dev branch only)
on:
  push:
    branches: [dev]
    paths: ['base/**', 'overlays/dev/**', 'overlays/cmc-common/**']
  repository_dispatch:
    types: [deploy-dev-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    uses: hgiang25/odoo-cmc-gitops/.github/workflows/deploy-environment.yml@main
    with:
      environment: dev
      expected_tag: ${{ github.event.client_payload.image_tag || '' }}
    secrets: inherit
