name: Bootstrap Argo CD on CMC
permissions:
  contents: read
concurrency:
  group: odoo-cmc-runtime
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on:
    - self-hosted
    - Linux
    - X64
    environment: odoo-${{ inputs.environment }}
    timeout-minutes: 120
    env:
      ODOO_ENV: ${{ inputs.environment }}
      ODOO_NAMESPACE: odoo-${{ inputs.environment }}
      KUBE_CONTEXT: ${{ vars.CMC_KUBE_CONTEXT }}
      ARGOCD_CHART_VERSION: 10.10.3
      CMC_RWX_STORAGE_CLASS: ${{ vars.CMC_RWX_STORAGE_CLASS || 'nfs-csi' }}
      CMC_POSTGRES_HOST: ${{ vars.CMC_POSTGRES_HOST }}
      CMC_POSTGRES_PORT: ${{ vars.CMC_POSTGRES_PORT || '5432' }}
      CMC_POSTGRES_DATABASE: ${{ vars.CMC_POSTGRES_DATABASE }}
      CMC_POSTGRES_SSLMODE: ${{ vars.CMC_POSTGRES_SSLMODE || 'disable' }}
      CMC_POSTGRES_USER: ${{ secrets.CMC_POSTGRES_USER }}
      CMC_POSTGRES_PASSWORD: ${{ secrets.CMC_POSTGRES_PASSWORD }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CMC_S3_ACCESS_KEY_ID: ${{ secrets.CMC_S3_ACCESS_KEY_ID }}
      CMC_S3_SECRET_ACCESS_KEY: ${{ secrets.CMC_S3_SECRET_ACCESS_KEY }}
      CMC_TLS_CERTIFICATE: ${{ secrets.CMC_TLS_CERTIFICATE }}
      CMC_TLS_PRIVATE_KEY: ${{ secrets.CMC_TLS_PRIVATE_KEY }}
      ODOO_DOMAIN: ${{ vars.ODOO_DOMAIN }}
      EXPECTED_TAG: ${{ inputs.expected_tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.revision || 'main' }}
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.environment }}
        path: environment-source
        fetch-depth: 0
    - name: Create isolated Python environment
      shell: bash
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/odoo-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ODOO_ENV"
        python3 -m venv "$venv"
        "$venv/bin/python" -m pip install -r requirements-tools.txt
        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "DEPLOY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "WORKLOAD_REVISION=$(git -C environment-source rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "SECRET_STATE=$RUNNER_TEMP/odoo-secrets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ODOO_ENV.json" >> "$GITHUB_ENV"
    - name: Verify bastion tools, context, and committed configuration
      shell: bash
      run: |
        set -euo pipefail
        command -v kubectl
        command -v helm
        command -v openssl
        git fetch origin main
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
          echo 'Main advanced since this deployment was prepared. Start a new Deploy CMC run.' >&2
          exit 1
        fi
        git -C environment-source fetch origin "$ODOO_ENV"
        test "$WORKLOAD_REVISION" = "$(git -C environment-source rev-parse "origin/$ODOO_ENV")"
        python environment-source/scripts/check_deploy_inputs.py
        kubectl config get-contexts -o name | grep -Fx -- "$KUBE_CONTEXT"
        kubectl --context "$KUBE_CONTEXT" --request-timeout=15s get --raw=/readyz
        kubectl --context "$KUBE_CONTEXT" get storageclass "$CMC_RWX_STORAGE_CLASS"
        python scripts/environment.py preflight --environment "$ODOO_ENV" --context "$KUBE_CONTEXT"
        python scripts/reconcile.py legacy-guard --environment "$ODOO_ENV" --context "$KUBE_CONTEXT"
        python scripts/runtime_secrets.py snapshot --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --state "$SECRET_STATE"
    - name: Create namespaces and generated runtime secrets
      shell: bash
      run: |
        set -euo pipefail
        for namespace in argocd apisix "$ODOO_NAMESPACE"; do
          kubectl --context "$KUBE_CONTEXT" create namespace "$namespace" --dry-run=client -o yaml |
            kubectl --context "$KUBE_CONTEXT" apply -f -
        done
        if ! kubectl --context "$KUBE_CONTEXT" -n apisix get secret apisix-admin-credentials >/dev/null 2>&1; then
          kubectl --context "$KUBE_CONTEXT" -n apisix create secret generic apisix-admin-credentials \
            --from-literal=admin="$(openssl rand -base64 36)" \
            --from-literal=viewer="$(openssl rand -base64 36)"
        fi
        if ! kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get secret odoo-secrets >/dev/null 2>&1; then
          if kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get pvc odoo-filestore-pvc >/dev/null 2>&1; then
            echo "odoo-filestore-pvc exists but odoo-secrets is missing; restore the original Secret."
            exit 1
          fi
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" create secret generic odoo-secrets \
            --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 36)" \
            --from-literal=ADMIN_LOGIN_PASSWORD="$(openssl rand -base64 24)"
        fi
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" create secret generic odoo-db-connection \
          --from-literal=HOST="$CMC_POSTGRES_HOST" \
          --from-literal=PORT="$CMC_POSTGRES_PORT" \
          --from-literal=DATABASE="$CMC_POSTGRES_DATABASE" \
          --from-literal=SSLMODE="$CMC_POSTGRES_SSLMODE" \
          --from-literal=USER="$CMC_POSTGRES_USER" \
          --from-literal=PASSWORD="$CMC_POSTGRES_PASSWORD" \
          --dry-run=client -o yaml | kubectl --context "$KUBE_CONTEXT" apply -f -
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" create secret docker-registry odoo-registry \
          --docker-server=docker.io \
          --docker-username="$DOCKERHUB_USERNAME" \
          --docker-password="$DOCKERHUB_TOKEN" \
          --dry-run=client -o yaml | kubectl --context "$KUBE_CONTEXT" apply -f -
        if [ -n "$CMC_S3_ACCESS_KEY_ID" ] || [ -n "$CMC_S3_SECRET_ACCESS_KEY" ]; then
          test -n "$CMC_S3_ACCESS_KEY_ID"
          test -n "$CMC_S3_SECRET_ACCESS_KEY"
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" create secret generic odoo-s3-credentials \
            --from-literal=AWS_ACCESS_KEY_ID="$CMC_S3_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$CMC_S3_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl --context "$KUBE_CONTEXT" apply -f -
        fi
        if [ "$ODOO_ENV" = prod ]; then
        tls_dir="$(mktemp -d)"
        trap 'rm -rf "$tls_dir"' EXIT
        printf '%s' "$CMC_TLS_CERTIFICATE" > "$tls_dir/tls.crt"
        printf '%s' "$CMC_TLS_PRIVATE_KEY" > "$tls_dir/tls.key"
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" create secret tls odoo-tls \
          --cert="$tls_dir/tls.crt" --key="$tls_dir/tls.key" \
          --dry-run=client -o yaml | kubectl --context "$KUBE_CONTEXT" apply -f -
        fi
        for key in admin viewer; do
          test -n "$(kubectl --context "$KUBE_CONTEXT" -n apisix get secret apisix-admin-credentials -o "jsonpath={.data.$key}")"
        done
        for key in ADMIN_PASSWORD ADMIN_LOGIN_PASSWORD; do
          test -n "$(kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get secret odoo-secrets -o "jsonpath={.data.$key}")"
        done
        for key in HOST PORT DATABASE SSLMODE USER PASSWORD; do
          test -n "$(kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get secret odoo-db-connection -o "jsonpath={.data.$key}")"
        done
        if kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get pvc postgres-pvc >/dev/null 2>&1; then
          echo "Legacy in-cluster postgres-pvc exists. Migrate and verify it in DBaaS before GitOps pruning."
          exit 1
        fi
        if [ "$ODOO_ENV" = prod ]; then
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get secret odoo-tls -o jsonpath='{.data.tls\.crt}' | grep -q .
        fi
        python3 scripts/environment.py preflight --environment "$ODOO_ENV" --context "$KUBE_CONTEXT"
    - name: Verify NFS RWX write access as Odoo UID 101
      shell: bash
      run: |
        set -euo pipefail
        existing_class="$(kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get pvc odoo-filestore-pvc \
          -o jsonpath='{.spec.storageClassName}' 2>/dev/null || true)"
        if [ -n "$existing_class" ] && [ "$existing_class" != "$CMC_RWX_STORAGE_CLASS" ]; then
          echo "odoo-filestore-pvc already uses StorageClass $existing_class; expected $CMC_RWX_STORAGE_CLASS." >&2
          exit 1
        fi
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" delete job odoo-nfs-preflight \
          --ignore-not-found --wait=true
        python3 scripts/environment.py render-bootstrap --environment "$ODOO_ENV" --kind nfs \
          --storage-class "$CMC_RWX_STORAGE_CLASS" | kubectl --context "$KUBE_CONTEXT" apply -f -
        if ! kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" wait \
          --for=jsonpath='{.status.phase}'=Bound pvc/odoo-filestore-pvc --timeout=180s; then
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" describe pvc odoo-filestore-pvc || true
          exit 1
        fi
        if ! kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" wait \
          --for=condition=complete job/odoo-nfs-preflight --timeout=180s; then
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" logs job/odoo-nfs-preflight || true
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" describe job odoo-nfs-preflight || true
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get pods -l component=nfs-preflight -o wide || true
          echo 'NFS must allow UID/GID 101 to write. Check root_squash, anonuid/anongid, and PVC directory ownership.' >&2
          exit 1
        fi
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" logs job/odoo-nfs-preflight
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" delete job odoo-nfs-preflight --wait=true
    - name: Verify PostgreSQL 16 from inside the cluster
      shell: bash
      run: |
        set -euo pipefail
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" delete job odoo-dbaas-preflight --ignore-not-found --wait=true
        python3 scripts/environment.py render-bootstrap --environment "$ODOO_ENV" --kind db | \
          kubectl --context "$KUBE_CONTEXT" apply -f -
        if ! kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" wait --for=condition=complete job/odoo-dbaas-preflight --timeout=180s; then
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" logs job/odoo-dbaas-preflight || true
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" describe job odoo-dbaas-preflight || true
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get pods -l component=dbaas-preflight -o wide || true
          exit 1
        fi
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" logs job/odoo-dbaas-preflight
        kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" delete job odoo-dbaas-preflight --wait=true
    - name: Install Argo CD via Helm
      shell: bash
      run: |
        set -euo pipefail
        helm --kube-context "$KUBE_CONTEXT" upgrade --install argocd argo-cd \
          --repo https://argoproj.github.io/argo-helm \
          --version "$ARGOCD_CHART_VERSION" \
          --namespace argocd \
          --wait --timeout 10m
    - name: Wait for Argo CD controllers to be fully ready
      shell: bash
      run: |
        set -euo pipefail
        echo "Waiting for argocd-server..."
        kubectl --context "$KUBE_CONTEXT" -n argocd rollout status deployment/argocd-server --timeout=300s
        echo "Waiting for argocd-repo-server..."
        kubectl --context "$KUBE_CONTEXT" -n argocd rollout status deployment/argocd-repo-server --timeout=300s
        echo "Waiting for argocd-application-controller..."
        kubectl --context "$KUBE_CONTEXT" -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
        echo "All Argo CD components are ready."
    - name: Register the AppProject and root Application
      shell: bash
      run: |
        set -euo pipefail
        kubectl --context "$KUBE_CONTEXT" apply -f bootstrap/odoo-cmc-project.yaml
        kubectl --context "$KUBE_CONTEXT" apply -f bootstrap/odoo-dev-project.yaml
        kubectl --context "$KUBE_CONTEXT" apply -f bootstrap/odoo-prod-project.yaml
        kubectl --context "$KUBE_CONTEXT" apply -f bootstrap/odoo-cmc-root.yaml
        echo "Root application registered. Argo CD will now reconcile all child applications."
        kubectl --context "$KUBE_CONTEXT" -n argocd get applications.argoproj.io
    - name: Detect runtime Secret changes
      id: secrets
      shell: bash
      run: |
        set -euo pipefail
        python scripts/runtime_secrets.py changed --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --state "$SECRET_STATE" >> "$GITHUB_OUTPUT"
    - name: Reconcile platform then the selected environment through Argo CD
      shell: bash
      run: |
        set -euo pipefail
        python scripts/reconcile.py sync --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --revision "$WORKLOAD_REVISION" --platform-revision "$DEPLOY_REVISION"
    - name: Restart existing Odoo workloads after runtime Secret reconciliation
      shell: bash
      run: |
        set -euo pipefail
        if kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" get rollout odoo-web-rollout >/dev/null 2>&1; then
          restart_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" patch rollout odoo-web-rollout \
            --type=merge --patch "{\"spec\":{\"restartAt\":\"$restart_at\"}}"
          for deployment in odoo-worker odoo-cron odoo-queue-runner; do
            kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" rollout restart "deployment/$deployment"
            kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" rollout status "deployment/$deployment" --timeout=600s
          done
          kubectl --context "$KUBE_CONTEXT" -n "$ODOO_NAMESPACE" wait \
            --for=jsonpath='{.status.phase}'=Healthy rollout/odoo-web-rollout --timeout=1200s
        else
          echo 'No existing Odoo Rollout; first Argo reconciliation will consume the new Secrets.'
        fi
      if: steps.secrets.outputs.restart == 'true'
    - name: Verify exact revision, running pods, isolation and HTTP/database health
      shell: bash
      run: |
        set -euo pipefail
        python scripts/reconcile.py verify --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --revision "$WORKLOAD_REVISION" --platform-revision "$DEPLOY_REVISION" --workload-root environment-source --expected-tag "$EXPECTED_TAG"
        python scripts/environment.py preflight --environment "$ODOO_ENV" --context "$KUBE_CONTEXT"
        python scripts/verify_endpoint.py --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --domain "$ODOO_DOMAIN"
        python scripts/runtime_secrets.py accept --environment "$ODOO_ENV" --context "$KUBE_CONTEXT" --state "$SECRET_STATE"
        printf 'Deployed %s at workload %s; platform %s\n' "$ODOO_ENV" "$WORKLOAD_REVISION" "$DEPLOY_REVISION" >> "$GITHUB_STEP_SUMMARY"
    if: github.ref == 'refs/heads/main'
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose runtime Secrets and data paths will be checked
        type: choice
        options:
        - dev
        - prod
        default: dev
        required: true
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: false
        type: string
        default: main
      expected_tag:
        required: false
        type: string
        default: ''
