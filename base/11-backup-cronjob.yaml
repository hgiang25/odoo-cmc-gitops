apiVersion: batch/v1
kind: CronJob
metadata:
  name: odoo-disaster-recovery-backup
  namespace: odoo-system
  labels: {}
spec:
  schedule: 0 2 * * *
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: odoo
            component: disaster-recovery
        spec:
          serviceAccountName: odoo-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          containers:
          - name: backup
            image: odoo-backup:15-lab
            command:
            - python3
            - /opt/backup/backup.py
            env:
            - name: PGHOST
              value: postgres-service
            - name: PGDATABASE
              value: odoo17_dev
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: POSTGRES_PASSWORD
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: db_sslmode
            - name: S3_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: s3_required
            - name: S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: s3_endpoint_url
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: s3_bucket
            - name: S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: s3_prefix
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: odoo-runtime-settings
                  key: aws_region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: odoo-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: odoo-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            volumeMounts:
            - name: filestore
              mountPath: /var/lib/odoo
              readOnly: true
            - name: backup
              mountPath: /backup
          volumes:
          - name: filestore
            persistentVolumeClaim:
              claimName: odoo-filestore-pvc
          - name: backup
            persistentVolumeClaim:
              claimName: odoo-backup-pvc
