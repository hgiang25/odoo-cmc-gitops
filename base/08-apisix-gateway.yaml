apiVersion: apisix.apache.org/v2
kind: ApisixConsumer
metadata:
  name: partner-standard
  namespace: odoo-system
spec:
  authParameter:
    keyAuth:
      secretRef:
        name: odoo-partner-standard-key
---
apiVersion: apisix.apache.org/v2
kind: ApisixConsumer
metadata:
  name: partner-vip
  namespace: odoo-system
spec:
  authParameter:
    keyAuth:
      secretRef:
        name: odoo-partner-vip-key
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: odoo-gateway
  namespace: odoo-system
spec:
  http:
  - name: internal-endpoints
    priority: 200
    match:
      hosts:
      - odoo.local
      paths:
      - /queue_job/*
      - /web/database
      - /web/database/*
    backends:
    - serviceName: odoo-web-stable
      servicePort: 8069
    plugins:
    - name: fault-injection
      enable: true
      config:
        abort:
          http_status: 403
          body: Internal endpoint
  - name: partner-api-vip
    priority: 160
    match:
      hosts:
      - odoo.local
      paths:
      - /jsonrpc
      - /jsonrpc/*
      - /xmlrpc/2
      - /xmlrpc/2/*
      - /web/dataset/call_kw
      - /web/dataset/call_kw/*
      exprs:
      - subject:
          scope: Header
          name: X-Partner-Tier
        op: Equal
        value: vip
    websocket: false
    timeout:
      connect: 15s
      read: 60s
      send: 60s
    authentication:
      enable: true
      type: keyAuth
      keyAuth:
        header: apikey
    backends:
    - serviceName: odoo-web-stable
      servicePort: 8069
      weight: 100
    - serviceName: odoo-web-canary
      servicePort: 8069
      weight: 0
    plugins:
    - name: consumer-restriction
      enable: true
      config:
        type: consumer_name
        whitelist:
        - partner-vip
        rejected_code: 403
    - name: limit-count
      enable: true
      config:
        count: 500
        time_window: 60
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: Too Many Requests
        policy: local
    - name: limit-conn
      enable: true
      config:
        conn: 20
        burst: 10
        default_conn_delay: 0.1
        key_type: var
        key: consumer_name
        rejected_code: 429
    - name: api-breaker
      enable: true
      config:
        break_response_code: 503
        break_response_body: Service Temporarily Unavailable - Circuit Breaker Open
        max_breaker_sec: 60
        unhealthy:
          http_statuses:
          - 500
          - 502
          - 503
          - 504
          failures: 3
        healthy:
          http_statuses:
          - 200
          successes: 3
    - name: prometheus
      enable: true
      config:
        prefer_name: true
  - name: partner-api-standard
    priority: 150
    match:
      hosts:
      - odoo.local
      paths:
      - /jsonrpc
      - /jsonrpc/*
      - /xmlrpc/2
      - /xmlrpc/2/*
      - /web/dataset/call_kw
      - /web/dataset/call_kw/*
    websocket: false
    timeout:
      connect: 15s
      read: 60s
      send: 60s
    authentication:
      enable: true
      type: keyAuth
      keyAuth:
        header: apikey
    backends:
    - serviceName: odoo-web-stable
      servicePort: 8069
      weight: 100
    - serviceName: odoo-web-canary
      servicePort: 8069
      weight: 0
    plugins:
    - name: consumer-restriction
      enable: true
      config:
        type: consumer_name
        whitelist:
        - partner-standard
        - partner-vip
        rejected_code: 403
    - name: limit-count
      enable: true
      config:
        count: 50
        time_window: 60
        key_type: var
        key: consumer_name
        rejected_code: 429
        rejected_msg: Too Many Requests
        policy: local
    - name: limit-conn
      enable: true
      config:
        conn: 5
        burst: 2
        default_conn_delay: 0.1
        key_type: var
        key: consumer_name
        rejected_code: 429
    - name: api-breaker
      enable: true
      config:
        break_response_code: 503
        break_response_body: Service Temporarily Unavailable - Circuit Breaker Open
        max_breaker_sec: 60
        unhealthy:
          http_statuses:
          - 500
          - 502
          - 503
          - 504
          failures: 3
        healthy:
          http_statuses:
          - 200
          successes: 3
    - name: prometheus
      enable: true
      config:
        prefer_name: true
  - name: websocket
    priority: 100
    match:
      hosts:
      - odoo.local
      paths:
      - /websocket
      - /websocket/*
    websocket: true
    timeout:
      connect: 60s
      read: 600s
      send: 600s
    backends:
    - serviceName: odoo-web-stable
      servicePort: 8072
      weight: 100
    - serviceName: odoo-web-canary
      servicePort: 8072
      weight: 0
    plugins:
    - name: prometheus
      enable: true
      config:
        prefer_name: true
  - name: http
    priority: 0
    match:
      hosts:
      - odoo.local
      paths:
      - /*
    websocket: false
    timeout:
      connect: 60s
      read: 600s
      send: 600s
    backends:
    - serviceName: odoo-web-stable
      servicePort: 8069
      weight: 100
    - serviceName: odoo-web-canary
      servicePort: 8069
      weight: 0
    plugins:
    - name: prometheus
      enable: true
      config:
        prefer_name: true

