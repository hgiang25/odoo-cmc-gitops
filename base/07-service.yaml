apiVersion: v1
kind: Service
metadata:
  name: odoo-web-stable
  namespace: odoo-system
  labels: {}
spec:
  type: ClusterIP
  selector:
    app: odoo
    component: web
  ports:
  - name: http
    port: 8069
    targetPort: http
  - name: websocket
    port: 8072
    targetPort: websocket
---
