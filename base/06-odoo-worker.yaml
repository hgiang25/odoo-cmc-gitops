apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-worker
  namespace: odoo-system
  labels: {}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
      component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: odoo
        component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 660
      initContainers:
        - name: render-config
          image: odoo-queue:17.0-lab
          command:
            - python3
            - /opt/odoo-k8s/render_config.py
          env:
            - name: ODOO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: ADMIN_PASSWORD
            - name: ODOO_DB_SSLMODE
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: SSLMODE
            - name: ODOO_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: DATABASE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config-template
              mountPath: /config
              readOnly: true
            - name: runtime-config
              mountPath: /etc/odoo
      containers:
        - name: odoo-worker
          image: odoo-queue:17.0-lab
          imagePullPolicy: IfNotPresent
          args:
            - odoo
            - -c
            - /etc/odoo/odoo.conf
            - --load=base,web,queue_job
            - --max-cron-threads=0
            - --workers=2
          env:
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: PORT
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db-connection
                  key: PASSWORD
            - name: ODOO_QUEUE_JOB_CHANNELS
              value:
                root:0
                # Thời gian tối đa để mở 1 kết nối mới (5 giây, quá 5s là hủy, không treo)
            - name: PGCONNECT_TIMEOUT
              value: "5"
            # Bật TCP Keepalive ở tầng client
            - name: PGKEEPALIVES
              value: "1"
            # Sau 10 giây không có tín hiệu thì bắt đầu thăm dò
            - name: PGKEEPALIVES_IDLE
              value: "10"
            # Cứ 5 giây thăm dò 1 lần
            - name: PGKEEPALIVES_INTERVAL
              value: "5"
            # Thăm dò 3 lần không thấy phản hồi là coi như socket đã chết -> Đóng ngay lập tức!
            - name: PGKEEPALIVES_COUNT
              value: "3"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2.5Gi
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/odoo
              readOnly: true
            - name: filestore-volume
              mountPath: /var/lib/odoo
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /web/health?db_server_status=1
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config-template
          configMap:
            name: odoo-config
        - name: runtime-config
          emptyDir: {}
        - name: filestore-volume
          persistentVolumeClaim:
            claimName: odoo-filestore-pvc
