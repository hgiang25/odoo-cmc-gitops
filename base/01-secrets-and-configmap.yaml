apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo-system
  labels: {}
data:
  odoo.conf: |
    [options]
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/oca/queue
    data_dir = /var/lib/odoo
    ; Credentials are injected from a generated Secret.
    db_name = odoo17_dev
    dbfilter = ^odoo17_dev$
    db_maxconn = 4
    db_maxconn_gevent = 4
    proxy_mode = True
    list_db = False
    http_interface = 0.0.0.0
    http_port = 8069
    gevent_port = 8072
    limit_time_cpu = 600
    limit_time_real = 600
    limit_time_real_cron = 600
    limit_memory_soft = 805306368
    limit_memory_hard = 1073741824
    log_level = info
