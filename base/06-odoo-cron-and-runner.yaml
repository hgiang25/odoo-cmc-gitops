        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 660
      initContainers:
      - name: render-config
        image: odoo-queue:17.0-lab
        command:
        - python3
        - /opt/odoo-k8s/render_config.py
        env:
        - name: ODOO_ADMIN_PASSWORD
