apiVersion: v1
kind: ServiceAccount
metadata:
  name: odoo-backup
  namespace: odoo-system
  labels: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odoo-backup
  namespace: odoo-system
  labels: {}
rules:
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  resourceNames:
  - odoo-web-rollout
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments/scale
  resourceNames:
  - odoo-worker
  - odoo-cron
  - odoo-queue-runner
  verbs:
  - get
  - patch
- apiGroups:
  - argoproj.io
  resources:
  - rollouts/scale
  resourceNames:
  - odoo-web-rollout
  verbs:
  - get
  - patch
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  resourceNames:
  - odoo-web-autoscaler
  - odoo-worker-autoscaler
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - odoo-backup-lock
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odoo-backup
  namespace: odoo-system
  labels: {}
subjects:
- kind: ServiceAccount
  name: odoo-backup
  namespace: odoo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odoo-backup
