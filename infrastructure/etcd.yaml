apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: apisix
spec:
  serviceName: apisix-etcd
  replicas: 1
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      automountServiceAccountToken: false
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.21
        command:
        - etcd
        args:
        - --name=apisix-etcd
        - --data-dir=/etcd-data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://apisix-etcd.apisix.svc.cluster.local:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://apisix-etcd:2380
        - --initial-cluster=apisix-etcd=http://apisix-etcd:2380
        ports:
        - containerPort: 2379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /etcd-data
        readinessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: apisix
spec:
  selector:
    app: apisix-etcd
  ports:
  - port: 2379
    targetPort: 2379
    name: client
  - port: 2380
    targetPort: 2380
    name: peer
  clusterIP: None
