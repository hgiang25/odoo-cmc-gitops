apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: apisix
spec:
  serviceName: apisix-etcd
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: apisix-etcd
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.21
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /usr/local/bin/etcd
        args:
        - --name=$(POD_NAME)
        - --data-dir=/etcd-data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://$(POD_NAME).apisix-etcd.apisix.svc.cluster.local:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://$(POD_NAME).apisix-etcd.apisix.svc.cluster.local:2380
        - --initial-cluster=apisix-etcd-0=http://apisix-etcd-0.apisix-etcd.apisix.svc.cluster.local:2380,apisix-etcd-1=http://apisix-etcd-1.apisix-etcd.apisix.svc.cluster.local:2380,apisix-etcd-2=http://apisix-etcd-2.apisix-etcd.apisix.svc.cluster.local:2380
        - --initial-cluster-state=new
        - --initial-cluster-token=odoo-apisix-etcd
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /etcd-data
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/etcdctl
            - --endpoints=http://127.0.0.1:2379
            - endpoint
            - health
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/etcdctl
            - --endpoints=http://127.0.0.1:2379
            - endpoint
            - health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: apisix
spec:
  publishNotReadyAddresses: true
  selector:
    app: apisix-etcd
  ports:
  - port: 2379
    targetPort: 2379
    name: client
  - port: 2380
    targetPort: 2380
    name: peer
  clusterIP: None
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-etcd
  namespace: apisix
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: apisix-etcd
