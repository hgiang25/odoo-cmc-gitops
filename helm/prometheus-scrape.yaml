scrape_configs:
- job_name: odoo-apisix
  metrics_path: /apisix/prometheus/metrics
  scrape_interval: 15s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - apisix
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    action: keep
    regex: apisix
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    action: keep
    regex: '9091'
