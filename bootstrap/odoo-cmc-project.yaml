apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: odoo-cmc
  namespace: argocd
spec:
  description: Shared cluster controllers and retained legacy Odoo; Dev and Prod use dedicated projects
  sourceRepos:
  - https://github.com/hgiang25/odoo-cmc-gitops.git
  - https://apache.github.io/apisix-helm-chart
  - https://argoproj.github.io/argo-helm
  - https://kedacore.github.io/charts
  destinations:
  - server: https://kubernetes.default.svc
    namespace: odoo-system
  - server: https://kubernetes.default.svc
    namespace: apisix
  - server: https://kubernetes.default.svc
    namespace: argo-rollouts
  - server: https://kubernetes.default.svc
    namespace: keda
  - server: https://kubernetes.default.svc
    namespace: kube-system
  - server: https://kubernetes.default.svc
    namespace: argocd
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
